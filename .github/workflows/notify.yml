name: Notify on new published content
# Sends FCM pushes for news/shops docs that are published but not yet notified.
# Auth: Workload Identity Federation (no service-account keys). Repo-scoped via
# the provider condition assertion.repository == 'AbotayamDesign/dalil-baladi'.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: dalil-notifications
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install google-auth-library@9 --no-fund --no-audit

      - name: Send notifications for new published items
        env:
          GCP_PROJECT_ID: dalil-baladi
        run: |
          node <<'EOF'
          // firebase-admin cannot parse WIF external_account credentials, so use
          // google-auth-library for the token and plain REST for Firestore + FCM.
          const { GoogleAuth } = require('google-auth-library');
          const { createHash } = require('node:crypto');
          const PROJECT = process.env.GCP_PROJECT_ID;
          const FS = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
          const FCM = `https://fcm.googleapis.com/v1/projects/${PROJECT}/messages:send`;

          async function main() {
            const auth = new GoogleAuth({ scopes: [
              'https://www.googleapis.com/auth/datastore',
              'https://www.googleapis.com/auth/firebase.messaging'
            ] });
            const client = await auth.getClient();
            const { token } = await client.getAccessToken();
            const H = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };

            async function runQuery(coll) {
              const res = await fetch(`${FS}:runQuery`, { method: 'POST', headers: H, body: JSON.stringify({
                structuredQuery: {
                  from: [{ collectionId: coll }],
                  where: { compositeFilter: { op: 'AND', filters: [
                    { fieldFilter: { field: { fieldPath: 'published' }, op: 'EQUAL', value: { booleanValue: true } } },
                    { fieldFilter: { field: { fieldPath: 'notified' }, op: 'EQUAL', value: { booleanValue: false } } }
                  ] } }
                }
              })});
              if (!res.ok) throw new Error('runQuery ' + coll + ' ' + res.status + ' ' + (await res.text()).slice(0, 200));
              const rows = await res.json();
              return rows.filter(r => r.document).map(r => r.document);
            }
            async function listTokens() {
              const res = await fetch(`${FS}/pushTokens?pageSize=1000`, { headers: H });
              if (!res.ok) throw new Error('listTokens ' + res.status);
              const j = await res.json();
              return (j.documents || []).map(d => d.name.split('/').pop());
            }
            async function markNotified(coll, id) {
              const res = await fetch(`${FS}/${coll}/${encodeURIComponent(id)}?updateMask.fieldPaths=notified&updateMask.fieldPaths=notifiedAt`, {
                method: 'PATCH', headers: H,
                body: JSON.stringify({ fields: { notified: { booleanValue: true }, notifiedAt: { timestampValue: new Date().toISOString() } } })
              });
              if (!res.ok) console.error('markNotified failed', coll, id, res.status);
            }
            async function deleteToken(t) {
              await fetch(`${FS}/pushTokens/${encodeURIComponent(t)}`, { method: 'DELETE', headers: H }).catch(() => {});
            }
            async function send(token, title, body, itemId, itemType) {
              const res = await fetch(FCM, { method: 'POST', headers: H, body: JSON.stringify({
                message: { token, notification: {title, body}, webpush: {notification:{icon:'https://abotayamdesign.github.io/dalil-baladi/icon-192.png',dir:'rtl',lang:'ar'},fcm_options:{link:'https://abotayamdesign.github.io/dalil-baladi/#'+itemType+'-'+itemId}}, data: { title, body, itemId, itemType } }
              })});
              if (res.ok) return 'ok';
              const j = await res.json().catch(() => ({}));
              const code = j.error && j.error.details && JSON.stringify(j.error.details) || '';
              if (/NOT_FOUND|UNREGISTERED/.test(code)) return 'dead';
              console.error('send failed', res.status, (j.error && j.error.message || '').slice(0, 120));
              return 'fail';
            }

            const docs = [
              ...(await runQuery('news')).map(d => ({ coll: 'news', d })),
              ...(await runQuery('shops')).map(d => ({ coll: 'shops', d }))
            ];
            if (!docs.length) { console.log('nothing new'); return; }
            const tokens = await listTokens();
            if (!tokens.length) { console.log('no subscribers yet; leaving notified=false'); return; }

            for (const { coll, d } of docs) {
              const f = d.fields || {};
              const txt = v => (v && v.stringValue) || '';
              const isShop = coll === 'shops';
              const title = isShop ? ('محل جديد: ' + txt(f.name)) : 'خبر جديد';
              const body = isShop ? txt(f.category) : (txt(f.title) + (txt(f.date) ? ' - ' + txt(f.date) : ''));
              const id = d.name.split('/').pop();
              let ok = 0, failed = 0;
              for (const t of tokens) {
                const r = await send(t, title, body, id, isShop ? 'shop' : 'news');
                const fingerprint=createHash('sha256').update(t).digest('hex').slice(0,16);
                console.log(JSON.stringify({targetFingerprint:fingerprint,status:r,at:new Date().toISOString()}));
                if (r === 'ok') ok++;
                else if (r === 'dead') await deleteToken(t);
                else failed++;
              }
              if(!failed) await markNotified(coll, id);
              else throw new Error('Notification delivery request failed; item left pending for retry');
              console.log(`${coll}/${id}: sent to ${ok}/${tokens.length}`);
            }
          }
          main().catch(e => { console.error(e.message || e); process.exit(1); });
          EOF
