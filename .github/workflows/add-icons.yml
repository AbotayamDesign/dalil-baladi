name: add-icons
on: workflow_dispatch
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write PNG icons
        run: |
          echo '' | base64 -d > icon-192.png
          echo '' | base64 -d > icon-512.png
          file icon-192.png icon-512.png
      - name: Commit icons
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add icon-192.png icon-512.png
          git commit -m "Add PNG app icons (192, 512)"
          git push
