name: Deploy Firestore rules
# Sends FCM pushes for news/shops docs that are published but not yet notified.
# Auth: Workload Identity Federation (no service-account keys). Repo-scoped via
# the provider condition assertion.repository == 'AbotayamDesign/dalil-baladi'.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install google-auth-library@9 --no-fund --no-audit

      - name: Deploy project rules
        run: |
          node <<'EOF'
          const {GoogleAuth}=require('google-auth-library');
          const rules="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function isAdmin() {\n      return request.auth != null && request.auth.uid == 'tGb0cMd4YfWlLkL8qAwRIHddRV32';\n    }\n    function clean(s) {\n      return s is string && s.size() >= 2 && s.size() <= 500\n        && !s.matches('(^|.*[^ء-ي])(خول|متناك|شرموط|شرموطة|قحبة|قحبه|عرص|منيوك|كسم|زب|طيز|نيك|عاهرة|دعارة|لعنة)([^ء-ي].*|$)');\n    }\n    match /news/{id} {\n      allow read: if resource.data.published == true || isAdmin();\n      allow write: if isAdmin();\n    }\n    match /shops/{id} {\n      allow read: if resource.data.published == true || isAdmin();\n      allow write: if isAdmin();\n    }\n    match /comments/{id} {\n      allow read: if resource.data.approved == true || isAdmin();\n      allow create: if request.auth != null\n        && request.resource.data.approved == true\n        && request.resource.data.keys().hasOnly(['itemId','name','text','approved','createdAt'])\n        && request.resource.data.itemId is string\n        && request.resource.data.itemId.size() <= 200\n        && request.resource.data.createdAt == request.time\n        && clean(request.resource.data.name)\n        && clean(request.resource.data.text);\n      allow update, delete: if isAdmin();\n    }\n    match /likes/{item}/devices/{uid} {\n      allow read: if true;\n      allow create, update: if request.auth != null && request.auth.uid == uid\n        && request.resource.data.keys().hasOnly(['at'])\n        && request.resource.data.at == request.time;\n      allow delete: if request.auth != null && request.auth.uid == uid;\n    }\n    match /shares/{item}/devices/{uid} {\n      allow read: if true;\n      allow create, update: if request.auth != null && request.auth.uid == uid\n        && request.resource.data.keys().hasOnly(['at'])\n        && request.resource.data.at == request.time;\n      allow delete: if request.auth != null && request.auth.uid == uid;\n    }\n    match /pushTokens/{token} {\n      allow read: if isAdmin();\n      allow create: if request.auth != null\n        && request.resource.data.keys().hasOnly(['at','ua'])\n        && request.resource.data.at == request.time\n        && request.resource.data.ua is string\n        && request.resource.data.ua.size() <= 150;\n      allow delete: if request.auth != null;\n      allow update: if false;\n    }\n    match /{document=**} {\n      allow read, write: if false;\n    }\n  }\n}\n";
          (async()=>{
           const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
           const c=await auth.getClient(); const {token}=await c.getAccessToken();
           const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
           const root='https://firebaserules.googleapis.com/v1/projects/dalil-baladi';
           let r=await fetch(root+'/rulesets',{method:'POST',headers,body:JSON.stringify({source:{files:[{name:'firestore.rules',content:rules}]}})});
           let j=await r.json();if(!r.ok) throw Error(JSON.stringify(j));
           const name=j.name; console.log('Created ruleset',name);
           r=await fetch(root+'/releases/cloud.firestore',{method:'PATCH',headers,body:JSON.stringify({release:{name:'projects/dalil-baladi/releases/cloud.firestore',rulesetName:name},updateMask:'rulesetName'})});
           j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));console.log('Activated',j.rulesetName);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          EOF
