name: Build requested brand icons
on: workflow_dispatch
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Write approved static icon assets
        run: |
          printf '%s' '' | base64 -d > brand25-192.png
          printf '%s' '' | base64 -d > brand25-512.png
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add brand25-192.png brand25-512.png
          git commit -m 'Add original Dalil Baladi green gold PNG icons'
          git push
